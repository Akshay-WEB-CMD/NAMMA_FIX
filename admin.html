<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Namma Fix</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
    
    :root {
      --dark-navy: #0f172a;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary-accent: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * {
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e293b, var(--dark-navy));
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
      flex: 1;
      width: 100%;
    }
    
    /* Login Section */
    #loginSection {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70vh;
      animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 50px 40px;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .login-box h2 {
      margin-top: 0;
      margin-bottom: 30px;
      font-weight: 700;
      font-size: 28px;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .login-input {
      width: 100%;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.2);
      color: white;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .login-input:focus {
      outline: none;
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }
    
    .login-btn {
      width: 100%;
      padding: 16px;
      background: var(--primary-accent);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .login-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px var(--primary-accent);
    }
    
    .login-error {
      color: #f87171;
      margin-top: 15px;
      font-size: 14px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    /* Dashboard Section */
    #dashboardSection {
      display: none;
      animation: fadeIn 0.6s ease-out;
    }
    
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding: 20px 30px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    
    .dashboard-header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }
    
    .logout-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: white;
    }
    
    .data-table-wrapper {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    
    th, td {
      padding: 20px 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    th {
      background: rgba(0, 0, 0, 0.3);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
    }
    
    tr {
      transition: background 0.2s ease;
    }
    
    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    a {
      color: var(--primary-accent);
      text-decoration: none;
    }
    
    a:hover {
      text-decoration: underline;
    }
    
    .status-badge {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .status-pending {
      background: rgba(234, 179, 8, 0.15);
      color: #fde047;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }
    
    .status-completed {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .action-btn {
      padding: 8px 16px;
      background: var(--primary-accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .action-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    
    .action-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <!-- Login View -->
    <div id="loginSection">
      <div class="login-box">
        <h2>Owner Portal</h2>
        <input type="password" id="adminPassword" class="login-input" placeholder="Enter Admin Password">
        <button id="loginBtn" class="login-btn">Secure Login</button>
        <div id="loginError" class="login-error">Incorrect Password</div>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardSection">
      <div class="dashboard-header">
        <h2>Customer Requests Database</h2>
        <button id="logoutBtn" class="logout-btn">Log Out</button>
      </div>
      
      <div class="data-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Customer Name</th>
              <th>Phone</th>
              <th>Details</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data injected via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
